spring:
  application:
    name: deskly-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5500/deskly}
    username: ${DATABASE_USERNAME:admindb}
    password: ${DATABASE_PASSWORD:passworddb}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

