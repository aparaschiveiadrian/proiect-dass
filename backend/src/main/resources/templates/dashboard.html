<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Dashboard</title></head>
<body>
<h1>Dashboard</h1>
<p>Logged in as: <strong th:text="${user.email}"></strong></p>
<p>Role: <strong th:text="${user.role}"></strong></p>
<nav>
    <a href="/tickets">My tickets</a> |
    <a href="/tickets/new">Create ticket</a> |
    <a th:if="${user.role.name() == 'MANAGER'}" href="/audit">Audit logs</a>
    <span th:if="${user.role.name() == 'MANAGER'}"> | </span>
    <form method="post" action="/logout" style="display:inline">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">Logout</button>
    </form>
</nav>
</body>
</html>
