<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Reset Password</title></head>
<body>
<h1>Reset Password</h1>
<p style="color:green" th:if="${success}" th:text="${success}"></p>
<p style="color:red" th:if="${error}" th:text="${error}"></p>
<form method="post" action="/reset-password">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label>Email <input name="email" type="email" th:value="${email}" required></label><br>
    <label>Token <input name="token" type="text" th:value="${token}" required></label><br>
    <label>New password <input name="newPassword" type="text" required></label><br>
    <button type="submit">Reset password</button>
</form>
<p>Fixed demo: the reset token expires and cannot be reused.</p>
<a href="/login">Login</a>
</body>
</html>
