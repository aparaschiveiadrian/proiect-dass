<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Tickets</title></head>
<body>
<h1>Tickets</h1>
<nav>
    <a href="/dashboard">Dashboard</a> |
    <a href="/tickets/new">Create ticket</a> |
    <a th:if="${canManageAllTickets}" href="/audit">Audit logs</a>
    <span th:if="${canManageAllTickets}"> | </span>
    <form method="post" action="/logout" style="display:inline">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">Logout</button>
    </form>
</nav>
<form method="get" action="/tickets/search">
    <label>Search <input name="q" th:value="${query}"></label>
    <button type="submit">Search</button>
</form>
<table border="1" cellpadding="6">
    <thead>
    <tr><th>ID</th><th>Title</th><th>Severity</th><th>Status</th><th>Owner</th><th>Actions</th></tr>
    </thead>
    <tbody>
    <tr th:each="ticket : ${tickets}">
        <td><code th:text="${ticket.id}"></code></td>
        <td th:text="${ticket.title}"></td>
        <td th:text="${ticket.severity}"></td>
        <td th:text="${ticket.status}"></td>
        <td th:text="${ticket.owner.email}"></td>
        <td>
            <a th:href="@{'/tickets/' + ${ticket.id}}">View</a>
            <a th:href="@{'/tickets/' + ${ticket.id} + '/edit'}">Edit</a>
            <form method="post" th:action="@{'/tickets/' + ${ticket.id} + '/delete'}" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<p th:if="${canManageAllTickets}">Fixed demo: manager can view and edit all tickets.</p>
<p th:unless="${canManageAllTickets}">Fixed demo: analyst can view and edit only own tickets.</p>
</body>
</html>
