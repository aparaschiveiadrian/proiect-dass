<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Audit Logs</title></head>
<body>
<h1>Audit Logs</h1>
<p>Visible only for managers. Logged in as: <strong th:text="${user.email}"></strong></p>
<nav>
    <a href="/dashboard">Dashboard</a> |
    <a href="/tickets">Tickets</a> |
    <form method="post" action="/logout" style="display:inline">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">Logout</button>
    </form>
</nav>
<table border="1" cellpadding="6">
    <thead>
    <tr>
        <th>Timestamp</th>
        <th>User</th>
        <th>Action</th>
        <th>Resource</th>
        <th>Resource ID</th>
        <th>IP</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="log : ${logs}">
        <td th:text="${log.timestamp}"></td>
        <td th:text="${log.user == null ? 'anonymous' : log.user.email}"></td>
        <td th:text="${log.action}"></td>
        <td th:text="${log.resource}"></td>
        <td th:text="${log.resourceId}"></td>
        <td th:text="${log.ipAddress}"></td>
    </tr>
    </tbody>
</table>
<p>Fixed demo: audit logs are available only to users with MANAGER role.</p>
</body>
</html>
