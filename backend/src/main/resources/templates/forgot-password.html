<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Forgot Password</title></head>
<body>
<h1>Forgot Password</h1>
<p th:if="${message}" th:text="${message}"></p>
<p th:if="${resetLink}">Generated reset link: <a th:href="${resetLink}" th:text="${resetLink}"></a></p>
<form method="post" action="/forgot-password">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label>Email <input name="email" type="email" required></label><br>
    <button type="submit">Generate reset link</button>
</form>
<p>Fixed demo: reset tokens are random, one-time and expire after 15 minutes.</p>
<a href="/login">Login</a> | <a href="/">Home</a>
</body>
</html>
